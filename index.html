<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11100f" />
    <meta name="description" content="KALAP! adalah dopamine marketplace simulasi versi Indonesia." />
    <title>KALAP! — The Dopamine Marketplace</title>
    <style>
      html,body{margin:0;min-height:100%;background:#11100f;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      #kalap-boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:#11100f}
      #kalap-boot .boot-card{width:min(420px,100%);padding:28px 22px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:#191716}
      #kalap-boot .boot-logo{width:58px;height:58px;margin:0 auto 16px;border-radius:17px;display:grid;place-items:center;background:#ee4d2d;font-size:22px;font-weight:900}
      #kalap-boot h1{margin:0 0 8px;font-size:26px}#kalap-boot p{margin:0;color:#aaa19c;line-height:1.5;font-size:14px}
      #kalap-boot button{margin-top:18px;border:0;border-radius:13px;background:#ee4d2d;color:#fff;padding:12px 18px;font-weight:800}
      .tracker-static-launcher{visibility:hidden}
      html[data-kalap-ready='1'] .tracker-static-launcher{visibility:visible}
    </style>
    <link rel="stylesheet" href="./src/styles.css?v=1105" />
    <link rel="stylesheet" href="./src/patch.css?v=1105" />
    <link rel="stylesheet" href="./src/tracker.css?v=1105" />
  </head>
  <body>
    <div id="root">
      <div id="kalap-boot">
        <div class="boot-card">
          <div class="boot-logo">K!</div>
          <h1>Memuat KALAP!</h1>
          <p id="kalap-boot-copy">Menyiapkan wallet, katalog, dan tracker lokal di device ini.</p>
          <button id="kalap-retry" type="button" hidden>Muat ulang</button>
        </div>
      </div>
    </div>
    <button id="kalap-tracker-launcher" class="tracker-static-launcher" type="button" aria-label="Buka tracker pesanan">
      <span>📦</span><strong>Pesanan</strong><b id="kalap-tracker-count" hidden>0</b>
    </button>
    <script>
      (function(){
        var root=document.getElementById('root');
        var observer=new MutationObserver(function(){
          if(root && !document.getElementById('kalap-boot') && root.children.length){
            document.documentElement.dataset.kalapReady='1';
            observer.disconnect();
          }
        });
        if(root) observer.observe(root,{childList:true,subtree:true});
        window.setTimeout(function(){
          if(document.documentElement.dataset.kalapReady==='1') return;
          var copy=document.getElementById('kalap-boot-copy');
          var retry=document.getElementById('kalap-retry');
          if(copy) copy.textContent='Koneksi ke aset GitHub Pages agak lambat. Coba muat ulang halaman.';
          if(retry){retry.hidden=false;retry.onclick=function(){location.reload()}}
        },7000);
      })();
    </script>
    <script type="module" src="./src/app.js?v=1105"></script>
    <script type="module" src="./src/tracker.js?v=1105"></script>
  </body>
</html>
